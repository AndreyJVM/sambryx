# ==============================================================================
# RECOMMENDED STARTUP:
# For local testing, use the sandbox script:
#   ./scripts/sandbox/run-sandbox.sh
# It waits for services and cleans up resources (networks and volumes)
# after the sandbox stops.
# ==============================================================================

services:
  web:
    image: sambryx-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: local
    container_name: sambryx
    restart: unless-stopped
    ports:
      # Web UI Port
      - "8080:8080"
    environment:
      - TZ=UTC
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - type: bind
        source: ${SSH_KNOWN_HOSTS_FILE:-./.local/sandbox/known_hosts}
        target: /etc/sambryx/known_hosts
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      samba-node:
        condition: service_healthy
    networks:
      - samba-network

  samba-node:
    image: andreyvorobevaqa/samba-node-sandbox:latest
    container_name: samba-node-sandbox
    hostname: samba-node
    restart: unless-stopped
    ports:
      # Samba / SMB Ports (mapped to alternate host ports to avoid Windows native SMB/NetBIOS conflict)
      - "1445:445"
      - "1139:139"
      # SSH Server (for direct verification from host)
      - "2222:22"
    volumes:
      # Named volumes for reliable storage & persistence across all platforms (Windows/Linux/macOS)
      - samba-shares:/srv/samba
      - samba-config:/etc/samba
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "service smbd status && service nmbd status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - samba-network

networks:
  samba-network:
    driver: bridge

volumes:
  samba-shares:
    name: samba_sandbox_shares
  samba-config:
    name: samba_sandbox_config
