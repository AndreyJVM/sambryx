site_name: Sambryx
site_description: Современный веб-интерфейс для управления сервером Samba на Spring Boot и Linux
site_author: Andrey Vorobev
repo_url: https://github.com/AndreyJVM/sambryx
repo_name: AndreyJVM/sambryx

theme:
  name: material
  language: ru
  palette:
    # Переключатель светлая/тёмная тема
    - scheme: default
      primary: black
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Включить тёмную тему
    - scheme: slate
      primary: black
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Включить светлую тему
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list

nav:
  - О проекте: index.md
  - Быстрый старт: quickstart.md
  - Временный доступ к UI: temporary-access.md
  - Подготовка сервера: server-setup.md
  - Рекомендации ФСТЭК: fstec.md
  - Архитектура: architecture.md
  - Сборка и поставки: distribution.md
  - Production Compose: production.md
  - SSH-ключи серверов: ssh-host-keys.md
  - Переименование: renaming.md
  - Статический анализ: static-analysis.md
  - Тестирование интерфейса: testing.md
