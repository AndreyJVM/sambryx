site_name: Sambryx
site_url: https://AndreyJVM.github.io/sambryx/
site_description: Установка, эксплуатация и разработка веб-панели управления Samba через SSH
site_author: Andrey Vorobev
repo_url: https://github.com/AndreyJVM/sambryx
repo_name: AndreyJVM/sambryx

theme:
  name: material
  language: ru
  palette:
    # Light and dark theme switch
    - scheme: default
      primary: black
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Включить тёмную тему
    - scheme: slate
      primary: black
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Включить светлую тему
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list

nav:
  - О проекте: index.md
  - Установка:
      - Быстрый старт: quickstart.md
      - Подготовка сервера: server-setup.md
      - Доверенные SSH-ключи: ssh-host-keys.md
      - Production Compose: production.md
      - Справочник настроек: settings.md
      - Переход с ShareGuard: renaming.md
  - Эксплуатация:
      - Общие папки: shares.md
      - Пользователи и группы: users-groups.md
      - Права доступа: permissions.md
      - Типовые проблемы: troubleshooting.md
      - Проверка доступа к ресурсу: access-diagnostics.md
      - Резервные копии конфигурации: configuration-backups.md
      - Веб- и SSH-сессии: sessions.md
      - Анализ правил ФСТЭК: fstec.md
      - Временный доступ к UI: temporary-access.md
  - Разработка:
      - Сборка и запуск: development.md
      - Архитектура: architecture.md
      - Тестирование: testing.md
      - Поставка и релизы: distribution.md
      - Статический анализ: static-analysis.md
