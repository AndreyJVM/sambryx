name: Sync Docker Hub Documentation

on:
  push:
    branches: [master]
    paths:
      - DOCKERHUB.md
      - .github/workflows/dockerhub-description.yml
      - scripts/ci/checks/verify-dockerhub.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-documentation
  cancel-in-progress: false

jobs:
  sync-description:
    name: Sync and Verify Docker Hub README
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: andreyvorobevaqa/sambryx
          short-description: Samba server management over SSH with a web interface
          readme-filepath: ./DOCKERHUB.md

      - name: Verify published README
        run: python3 scripts/ci/checks/verify-dockerhub.py andreyvorobevaqa/sambryx DOCKERHUB.md
