name: Repair Docker Release Aliases

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing recorded stable version without v, such as 0.13.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  repair:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sambryx-release-mutation
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Install digest-preserving image transport
        run: sudo apt-get update && sudo apt-get install --yes skopeo
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Verify public release and repair monotonic aliases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 scripts/ci/release/release.py repair --version "$RELEASE_VERSION"
