name: CI/CD Pipeline (Build, Test & Release)

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check shell script syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z -- '*.sh')

      - name: Test artifact verification guards
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify Code Formatting (Spotless)
        run: ./mvnw spotless:check

      - name: Build and Test with Maven
        run: ./mvnw -B clean package

      - name: Lint frontend
        working-directory: frontend
        run: ./node/npm run lint

      - name: Test frontend API client
        working-directory: frontend
        run: ./node/npm run test

      - name: Build and smoke-test standard runtime image
        shell: bash
        run: |
          jars=(target/*.jar)
          if [[ ${#jars[@]} -ne 1 || ! -f "${jars[0]}" ]]; then
            echo "Expected exactly one application JAR in target/" >&2
            exit 1
          fi
          python3 scripts/ci/verify-artifacts.py "${jars[0]}"
          docker build --build-arg "JAR_FILE=${jars[0]}" --tag sambryx-ci:standard .
          bash scripts/ci/smoke-docker.sh sambryx-ci:standard "${jars[0]}"

      - name: Upload Built JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sambryx-jar
          path: target/*.jar
          retention-days: 7

  browser-smoke:
    name: Browser Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Chromium and runner dependencies
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser smoke tests
        run: npm run test:browser

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  production-compose-smoke:
    name: Production Compose Smoke
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tested application JAR
        uses: actions/download-artifact@v4
        with:
          name: sambryx-jar
          path: target

      - name: Build application runtime
        run: docker build --tag sambryx-ci:production .

      - name: Pull TLS proxy image
        run: docker pull nginx:1.30.6-alpine

      - name: Build standalone Samba and SSH node
        run: docker build --tag sambryx-samba-node:ubuntu24.04 deploy/production/samba

      - name: Verify TLS, SSH, SMB and persistence
        run: python3 scripts/ci/smoke-production.py sambryx-ci:production

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-test, production-compose-smoke, browser-smoke]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Built JAR
        uses: actions/download-artifact@v4
        with:
          name: sambryx-jar
          path: release-artifacts

      - name: Generate Changelog & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-publish:
    name: Build & Publish Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test, production-compose-smoke, browser-smoke]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tested application JAR
        uses: actions/download-artifact@v4
        with:
          name: sambryx-jar
          path: target

      - name: Verify downloaded application artifact
        shell: bash
        run: |
          jars=(target/*.jar)
          if [[ ${#jars[@]} -ne 1 || ! -f "${jars[0]}" ]]; then
            echo "Expected exactly one tested application JAR" >&2
            exit 1
          fi
          python3 scripts/ci/verify-artifacts.py "${jars[0]}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Standard Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: andreyvorobevaqa/sambryx
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: Package Standard Docker image
        id: build-standard
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test Standard Docker image before publishing
        env:
          IMAGE_ID: ${{ steps.build-standard.outputs.imageid }}
        run: bash scripts/ci/smoke-docker.sh "$IMAGE_ID" target/*.jar

      - name: Extract Astra Docker metadata
        id: meta-astra
        uses: docker/metadata-action@v5
        with:
          images: andreyvorobevaqa/sambryx
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},prefix=astra-
            type=semver,pattern={{major}}.{{minor}},prefix=astra-
            type=raw,value=astra-latest,enable=true

      - name: Reject overlapping standard and Astra tags
        env:
          STANDARD_TAGS: ${{ steps.meta.outputs.tags }}
          ASTRA_TAGS: ${{ steps.meta-astra.outputs.tags }}
        shell: bash
        run: |
          test -n "$STANDARD_TAGS"
          test -n "$ASTRA_TAGS"
          while IFS= read -r tag; do
            if grep -Fxq -- "$tag" <<< "$STANDARD_TAGS"; then
              echo "Standard and Astra image tags must not overlap" >&2
              exit 1
            fi
          done <<< "$ASTRA_TAGS"

      - name: Package experimental Astra Docker image
        id: build-astra
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.astra
          load: true
          push: false
          tags: ${{ steps.meta-astra.outputs.tags }}
          labels: ${{ steps.meta-astra.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test experimental image on Ubuntu runner
        env:
          IMAGE_ID: ${{ steps.build-astra.outputs.imageid }}
        run: bash scripts/ci/smoke-docker.sh "$IMAGE_ID" target/*.jar

      - name: Publish smoke-tested Docker images
        env:
          STANDARD_TAGS: ${{ steps.meta.outputs.tags }}
          ASTRA_TAGS: ${{ steps.meta-astra.outputs.tags }}
        shell: bash
        run: |
          test -n "$STANDARD_TAGS"
          test -n "$ASTRA_TAGS"
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then docker push "$tag"; fi
          done <<< "$STANDARD_TAGS"
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then docker push "$tag"; fi
          done <<< "$ASTRA_TAGS"
