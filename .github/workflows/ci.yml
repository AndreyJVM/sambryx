name: CI/CD Pipeline (Build, Test & Release)

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Select Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      documents: ${{ steps.scope.outputs.documents }}
      mkdocs: ${{ steps.scope.outputs.mkdocs }}
      assets: ${{ steps.scope.outputs.assets }}
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      package: ${{ steps.scope.outputs.package }}
      browser: ${{ steps.scope.outputs.browser }}
      integration: ${{ steps.scope.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks from complete event range
        id: scope
        run: python3 scripts/ci/scope.py classify

  documents:
    name: Documentation
    needs: classify
    if: needs.classify.outputs.documents == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check local links, images, anchors and UTF-8
        run: python3 scripts/ci/documents.py
      - name: Install documentation builder
        if: needs.classify.outputs.mkdocs == 'true'
        run: pip install mkdocs-material==9.7.6
      - name: Build documentation strictly before merge
        if: needs.classify.outputs.mkdocs == 'true'
        run: mkdocs build --strict

  assets:
    name: Branding Assets
    needs: classify
    if: needs.classify.outputs.assets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate passive SVG assets
        run: python3 scripts/ci/documents.py assets
      - uses: actions/setup-node@v4
        with:
          node-version: '20.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Render branding at desktop and mobile sizes
        run: node frontend/tests/branding.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: branding-previews
          path: branding-previews/
          retention-days: 7
          if-no-files-found: error

  frontend:
    name: Frontend Checks
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend Checks
    needs: classify
    if: needs.classify.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Check formatting and backend behavior
        run: bash ./mvnw -B spotless:check verify -Dfrontend.skip=true -Dfrontend.copy.skip=true
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && !cancelled() }}
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/*.xml
            target/surefire-reports/*.txt
          retention-days: 7
          if-no-files-found: ignore

  build-and-test:
    name: Build & Test
    needs: classify
    if: needs.classify.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check shell script syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z -- '*.sh')

      - name: Test artifact verification guards
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package frontend in application JAR
        run: bash ./mvnw -B clean package -DskipTests

      - name: Verify consumed frontend artifact
        run: bash scripts/ci/select-jar.sh target

      - name: Upload Built JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sambryx-jar
          path: target/*.jar
          retention-days: 7

  browser-smoke:
    name: Browser Smoke Tests
    needs: classify
    if: needs.classify.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Chromium and runner dependencies
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser smoke tests
        run: npm run test:browser

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  production-compose-smoke:
    name: Production Compose Smoke
    runs-on: ubuntu-latest
    needs: [classify, build-and-test]
    if: needs.classify.outputs.integration == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tested application JAR
        uses: actions/download-artifact@v4
        with:
          name: sambryx-jar
          path: target

      - name: Build and smoke-test standard runtime image
        run: |
          jar=$(bash scripts/ci/select-jar.sh target)
          docker build --build-arg "JAR_FILE=$jar" --tag sambryx-ci:production .
          bash scripts/ci/smoke-docker.sh sambryx-ci:production "$jar"

      - name: Pull TLS proxy image
        run: docker pull nginx:1.30.6-alpine

      - name: Build standalone Samba and SSH node
        run: docker build --tag sambryx-samba-node:ubuntu24.04 deploy/production/samba

      - name: Verify TLS, SSH, SMB and persistence
        run: python3 scripts/ci/smoke-production.py sambryx-ci:production

  quality-gate:
    name: Quality Gate
    if: ${{ always() }}
    needs: [classify, documents, assets, frontend, backend, build-and-test, browser-smoke, production-compose-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require exactly the selected successful checks
        env:
          EXPECTED_PLAN: ${{ needs.classify.outputs.plan }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/scope.py gate

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    needs: [quality-gate, build-and-test]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Built JAR
        uses: actions/download-artifact@v4
        with:
          name: sambryx-jar
          path: release-artifacts

      - name: Generate Changelog & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-publish:
    name: Build & Publish Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [quality-gate, build-and-test]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tested application JAR
        uses: actions/download-artifact@v4
        with:
          name: sambryx-jar
          path: target

      - name: Verify downloaded application artifact
        run: bash scripts/ci/select-jar.sh target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Standard Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: andreyvorobevaqa/sambryx
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: Package Standard Docker image
        id: build-standard
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test Standard Docker image before publishing
        env:
          IMAGE_ID: ${{ steps.build-standard.outputs.imageid }}
        run: bash scripts/ci/smoke-docker.sh "$IMAGE_ID" target/*.jar

      - name: Validate standard Docker tags
        env:
          STANDARD_TAGS: ${{ steps.meta.outputs.tags }}
        run: python3 scripts/ci/docker-tags.py check

      - name: Publish smoke-tested Docker image
        env:
          STANDARD_TAGS: ${{ steps.meta.outputs.tags }}
        run: python3 scripts/ci/docker-tags.py push
