name: CI/CD Pipeline (Build, Test & Release)

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  classify:
    name: Select Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      documents: ${{ steps.scope.outputs.documents }}
      mkdocs: ${{ steps.scope.outputs.mkdocs }}
      assets: ${{ steps.scope.outputs.assets }}
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      package: ${{ steps.scope.outputs.package }}
      browser: ${{ steps.scope.outputs.browser }}
      integration: ${{ steps.scope.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks from complete event range
        id: scope
        run: python3 scripts/ci/checks/scope.py classify

  documents:
    name: Documentation
    needs: classify
    if: needs.classify.outputs.documents == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check local links, images, anchors and UTF-8
        run: python3 scripts/ci/checks/documents.py
      - name: Install documentation builder
        if: needs.classify.outputs.mkdocs == 'true'
        run: pip install mkdocs-material==9.7.6
      - name: Build documentation strictly
        if: needs.classify.outputs.mkdocs == 'true'
        run: mkdocs build --strict

  assets:
    name: Branding Assets
    needs: classify
    if: needs.classify.outputs.assets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate passive SVG assets
        run: python3 scripts/ci/checks/documents.py assets
      - name: Set up JDK 21 for browser checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tools/browser/pom.xml
      - name: Install Chromium and runner dependencies
        run: >-
          bash ./mvnw -B -f tools/browser/pom.xml exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test
          "-Dexec.args=install --with-deps chromium"
      - name: Render branding at desktop and mobile sizes
        run: bash ./mvnw -B -f tools/browser/pom.xml verify -Dit.test=BrandingIT
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: branding-previews
          path: tools/browser/target/browser-artifacts/branding/
          retention-days: 7
          if-no-files-found: error

  frontend:
    name: Frontend Checks
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend Checks
    needs: classify
    if: needs.classify.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Check formatting and backend behavior
        run: bash ./mvnw -B spotless:check verify -Dfrontend.skip=true -Dfrontend.copy.skip=true
      - name: Generate backend Allure report
        if: ${{ !cancelled() && hashFiles('target/allure-results/*-result.json') != '' }}
        run: bash ./mvnw -B allure:report
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('target/allure-results/*-result.json') != '' }}
        with:
          name: backend-allure-results
          path: target/allure-results/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('target/site/allure-maven-plugin/index.html') != '' }}
        with:
          name: backend-allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && !cancelled() }}
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/*.xml
            target/surefire-reports/*.txt
          retention-days: 7
          if-no-files-found: ignore

  build-and-test:
    name: Build & Test
    needs: classify
    if: needs.classify.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check shell script syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z -- '*.sh')

      - name: Test artifact verification guards
        run: python3 -B -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package frontend in application JAR
        run: bash ./mvnw -B clean package -DskipTests

      - name: Verify consumed frontend artifact
        run: bash scripts/ci/release/select-jar.sh target

      - name: Upload Built JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sambryx-jar
          path: target/*.jar
          retention-days: 7

  browser-smoke:
    name: Browser Smoke Tests
    needs: classify
    if: needs.classify.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21 for browser checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tools/browser/pom.xml
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Install Chromium and runner dependencies
        run: >-
          bash ./mvnw -B -f tools/browser/pom.xml exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test
          "-Dexec.args=install --with-deps chromium"
      - name: Run isolated browser smoke tests
        run: >-
          bash ./mvnw -B -f tools/browser/pom.xml verify
          -Dit.test=WorkspaceIT,AdministratorSessionIT,ConfigurationBackupIT,BackupCreationIT,ShareAccessIT,ServerReadinessIT,BackupComparisonIT,UserDeletionIT,AdStatusIT
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-report
          path: |
            tools/browser/target/browser-artifacts/
            tools/browser/target/failsafe-reports/
            tools/browser/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  production-compose-smoke:
    name: Production Compose Smoke
    runs-on: ubuntu-latest
    needs: [classify, build-and-test]
    if: needs.classify.outputs.integration == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 for Java smoke tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tools/smoke/pom.xml

      - name: Download tested application JAR
        uses: actions/download-artifact@v8
        with:
          name: sambryx-jar
          path: target

      - name: Build and smoke-test standard runtime image
        run: |
          jar=$(bash scripts/ci/release/select-jar.sh target)
          docker build --build-arg "JAR_FILE=$jar" --tag sambryx-ci:production .
          bash ./mvnw -B -f tools/smoke/pom.xml -Pdocker-smoke verify \
            -Dsmoke.image=sambryx-ci:production "-Dsmoke.jar=$(realpath "$jar")"

      - name: Pull TLS proxy image
        run: docker pull nginx:1.30.6-alpine

      - name: Build standalone Samba and SSH node
        run: docker build --tag sambryx-samba-node:ubuntu24.04 deploy/production/samba

      - name: Verify backup with non-root SSH and generated sudo policy
        run: >-
          bash ./mvnw -B test -Dfrontend.skip=true -Dfrontend.copy.skip=true
          -Dtest=BackupSshIT -Dbackup.ssh.image=sambryx-samba-node:ubuntu24.04

      - name: Verify TLS, SSH, SMB and persistence
        run: >-
          bash ./mvnw -B -f tools/smoke/pom.xml -Pproduction-smoke verify
          -Dsmoke.image=sambryx-ci:production

  quality-gate:
    name: Quality Gate
    if: ${{ always() }}
    needs: [classify, documents, assets, frontend, backend, build-and-test, browser-smoke, production-compose-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require exactly the selected successful checks
        env:
          EXPECTED_PLAN: ${{ needs.classify.outputs.plan }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/checks/scope.py gate

  release:
    name: Publish Verified Stable Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [quality-gate, build-and-test]
    if: >-
      ${{ success() && github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v') &&
          needs.quality-gate.result == 'success' && needs.build-and-test.result == 'success' }}
    concurrency:
      group: sambryx-release-mutation
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 for Java smoke tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tools/smoke/pom.xml

      - uses: actions/download-artifact@v8
        with:
          name: sambryx-jar
          path: target
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish a new verified stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/release/release.py publish
      - name: Preserve release files for manual investigation
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-files-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-work/release.json
            release-work/application.jar
            release-work/SHA256SUMS
          retention-days: 90
          if-no-files-found: ignore
