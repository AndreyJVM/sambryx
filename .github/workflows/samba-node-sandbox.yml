name: Build & Publish Samba Sandbox Image

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'docker/Dockerfile.samba'
      - 'scripts/sandbox/**'
      - 'config/smb-base.conf'
      - '.github/workflows/samba-node-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: samba-sandbox-build
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Samba sandbox image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/samba-node-sandbox"
          docker build \
            --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=Sambryx Samba sandbox test stand node" \
            -f docker/Dockerfile.samba .
          docker push "$IMAGE:latest"
